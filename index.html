index.html<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pengecheck Harga Barang</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .box-kamera { background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); text-align: center; margin-bottom: 30px; width: 100%; max-width: 450px; }
        video { width: 100%; border-radius: 8px; background: #222; transform: scaleX(-1); }
        .status { margin-top: 12px; color: #e67e22; font-weight: bold; font-size: 14px; padding: 8px; background: #fff3e0; border-radius: 6px; }
        
        
        /* Desain Kartu Galeri Baru yang Informatif */
        .kartu-foto { background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.05); border: 1px solid #e0e0e0; display: flex; flex-direction: column; }
        .kartu-foto img { width: 100%; height: 180px; object-fit: cover; }
        .info-foto { padding: 15px; font-size: 13px; color: #555; display: flex; flex-direction: column; gap: 6px; flex-grow: 1; }
        .waktu { font-weight: bold; color: #2c3e50; font-size: 14px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .koordinat { color: #7f8c8d; font-family: monospace; }
        .alamat { color: #27ae60; font-weight: 500; line-height: 1.4; }
        .btn-maps { background: #3498db; color: white; text-decoration: none; text-align: center; padding: 8px; border-radius: 6px; font-weight: bold; margin-top: auto; font-size: 12px; transition: background 0.2s; }
        .btn-maps:hover { background: #2980b9; }
    </style>
</head>
<body>

    <div class="box-kamera">
        <h2>Pengecheck Harga Barang</h2>
        <video id="videoKamera" autoplay playsinline></video>
        <div id="teksStatus" class="status">Mencari...</div>
    </div>

    <!-- Canvas tersembunyi dengan resolusi HD -->
    <canvas id="canvasGambar" style="display:none;"></canvas>

    <script type="module" src="./app.js"></script>
</body>
</html>
